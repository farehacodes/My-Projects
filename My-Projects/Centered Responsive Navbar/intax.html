<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.navbar {
    display: flex;
    height: 80px;
    padding: 0 20px;
    justify-content: space-between;
    align-items: center;

    background-color: #111827;
    border-bottom: 3px solid #d4af37;
}
.logo {
    font-size: 1.6em;
    font-weight: bold;
    color: #d4af37;
}
.nav {
    display: flex;
    gap: 15px;
}
.nav a {
    text-decoration: none;
    color: rgb(249, 248, 248);
    padding: 10px 15px;
    border-radius: 8px;
    transition: 0.3s;
}
.nav a:hover {
    background-color: #d4af37;
    color: #111827;
    transform: scale(1.05);
}
</style>
<body>
    <header class="navbar">
        <div class="logo">Faiha Collection</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">blog</a>
            <a href="#">Resources</a>
        </nav>
    </header>
</body>
</html>
