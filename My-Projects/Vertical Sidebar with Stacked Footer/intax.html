<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container {
    display: flex;
    height: 100vh;
    width: 850px;
    flex-direction: column;
    justify-content: space-between;
    align-items: stretch;
    background-color: #111827;
    padding: 20px;
    box-sizing: border-box;
}
.nav-links {
    background-color: #1f2937;
    padding: 15px;
    border-radius: 12px;
}
.nav-links p {
    color: white;
    padding: 12px;
    margin: 5px 0;
    border-radius: 8px;
    transition: 0.3s;
}
.nav-links p:hover {
    background-color: #d4af37;
    color: #111827;
}
.user-profile {
    background-color: #d4af37;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
}
</style>
<body>
    <aside class="container">
  <div class="item nav-links">
    <p>Dashboard</p>
    <p>Analytics</p>
    <p>Settings</p>
  </div>
  <div class="item user-profile">
    <p>Logged in as: Alex</p>
  </div>
</aside>
</body>
</html>
